# Deploys on push to main when genre-classifier/** changes — see
# bradjobe-dev-infra's cloudbuild_triggers.tf (google_cloudbuild_trigger.app["genre-classifier"]).
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - genre-classifier/Dockerfile
      - -t
      - ${_ARTIFACT_REGISTRY}/genre-classifier:${SHORT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY}/genre-classifier:${SHORT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - genre-classifier
      - --image=${_ARTIFACT_REGISTRY}/genre-classifier:${SHORT_SHA}
      - --region=${_REGION}
      - --quiet

substitutions:
  _REGION: northamerica-northeast1
  _ARTIFACT_REGISTRY: northamerica-northeast1-docker.pkg.dev/bradjobe-dev/apps

options:
  logging: CLOUD_LOGGING_ONLY
