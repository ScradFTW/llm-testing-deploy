# Deploys on push to main when image-classifier/** changes — see
# bradjobe-dev-infra's cloudbuild_triggers.tf (google_cloudbuild_trigger.app["image-classifier"]).
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd image-classifier
        pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
        pytest tests/

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - image-classifier/Dockerfile
      - -t
      - ${_ARTIFACT_REGISTRY}/image-classifier:${SHORT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY}/image-classifier:${SHORT_SHA}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - image-classifier
      - --image=${_ARTIFACT_REGISTRY}/image-classifier:${SHORT_SHA}
      - --region=${_REGION}
      - --quiet

substitutions:
  _REGION: northamerica-northeast1
  _ARTIFACT_REGISTRY: northamerica-northeast1-docker.pkg.dev/bradjobe-dev/apps

options:
  logging: CLOUD_LOGGING_ONLY
