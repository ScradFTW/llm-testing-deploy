# llm-testing: shared http-level config for the /llm-testing demo
# (limit_req_zone and log_format must live at http level, not inside a server block)

limit_req_zone $binary_remote_addr zone=llm_testing_zone:10m rate=6r/m;

log_format llm_json escape=json
  '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"status":$status,'
  '"request_time":$request_time,'
  '"bytes_sent":$bytes_sent,'
  '"request":"$request"'
  '}';
